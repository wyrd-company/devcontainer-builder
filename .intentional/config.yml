# relationships:
#   references: [go]
$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: component
discovery:
  managed-paths:
    - detector: go-module
      path: go.mod
      release-unit: dcb
    - detector: npm-package
      path: npm/package.json
      release-unit: dcb
release-units:
  dcb:
    path: .
    projections:
      - adapter: go
        file: go.mod
        mode: none
      - adapter: npm
        file: npm/package.json
        mode: committed
    tags:
      primary:
        role: primary
        template: '{version}'
