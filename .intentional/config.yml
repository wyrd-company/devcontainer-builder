# relationships:
#   references: [go]
$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
discovery:
  managed-paths:
    - detector: go-module
      path: go.mod
      release-unit: dcb
    - detector: npm-package
      path: npm/package.json
      release-unit: dcb
release-units:
  dcb:
    path: .
    projections:
      - adapter: go
        file: go.mod
        mode: none
      - adapter: npm
        file: npm/package.json
        mode: committed
      # The wyrd.foo product page shows the installed version.
      - adapter: yaml
        file: docs/user/docs.yml
        pointer: /products/dcb/version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{version}'
  # The public docs release on their own, so the docs footer can say which docs
  # describe which dcb version. Docs units are tag-only.
  dcb-docs:
    path: docs/user
    depends-on:
      - dcb
    projections:
      - adapter: yaml
        file: docs.yml
        pointer: /products/dcb/docs-version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
