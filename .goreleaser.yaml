# relationships:
#   references: [ taskfile, manifest ]
version: 2
project_name: dcb
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'
builds:
  - id: dcb
    main: ./cmd/dcb
    binary: dcb
    mod_timestamp: "{{ .CommitTimestamp }}"
    env: [ CGO_ENABLED=0 ]
    goos: [ linux, darwin ]
    goarch: [ amd64, arm64 ]
    flags: [ -trimpath ]
    ldflags:
      - "-s -w -X main.Version={{ .Version }}"
archives:
  - id: archives
    ids: [ dcb ]
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
nfpms:
  - id: packages
    ids: [ dcb ]
    package_name: dcb
    formats: [ deb, rpm ]
    vendor: Wyrd Company
    homepage: https://github.com/wyrd-company/devcontainer-builder
    maintainer: Wyrd Company <support@wyrd.company>
    description: Build and run development containers
    license: MIT
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/dcb/LICENSE
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/dcb/README.md
        file_info:
          mtime: "{{ .CommitDate }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
