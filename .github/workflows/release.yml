# relationships:
#   references: [ taskfile, config ]
name: Release
on:
  push:
    # Bare SemVer only: a docs record such as dcb-docs@0.1.0 starts no release.
    tags: [ '[0-9]*.[0-9]*.[0-9]*' ]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    name: Prove package publisher compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # This pin and the submit action pin name one repo.wyrd.foo commit.
    env:
      REPO_WYRD_FOO_PUBLISHER_COMMIT: 0fe7323712bfc5f109f947b8cb4ddab4f2d42017
      RELEASE_VERSION: ${{ github.ref_name }}
      # Both release units can tag one commit; GoReleaser must not pick the docs tag.
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - run: task release:publisher-pin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wyrd-company/repo.wyrd.foo
          ref: ${{ env.REPO_WYRD_FOO_PUBLISHER_COMMIT }}
          path: .repo-wyrd-foo-contract
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # ryl disable-line rule:line-length
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.19.0
          install-only: true
      - run: task release:inspectors
      - run: task release:snapshot
      - run: task release:compatibility
        env:
          PUBLISHER_ROOT: .repo-wyrd-foo-contract
  release:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      # Both release units can tag one commit; GoReleaser must not pick the docs tag.
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # ryl disable-line rule:line-length
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.19.0
          install-only: true
      - run: task release:preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          FORMULAE_PUBLISH_KEY: ${{ secrets.FORMULAE_PUBLISH_KEY }}
          REPO_WYRD_FOO_PUBLISHER_APP_ID: ${{ secrets.REPO_WYRD_FOO_PUBLISHER_APP_ID }}
          REPO_WYRD_FOO_PUBLISHER_PRIVATE_KEY: ${{ secrets.REPO_WYRD_FOO_PUBLISHER_PRIVATE_KEY }}
          WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
          # ryl disable-line rule:line-length
          WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
      - run: task release:yaml-tool
      - run: task release:check
      - run: task release:inspectors
      - run: task release:build
      - run: task release:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-release-manifest
          overwrite: true
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - run: task release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: task release:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wyrd-company/homebrew-tools
          ref: main
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}
          persist-credentials: true
      - run: task release:homebrew
