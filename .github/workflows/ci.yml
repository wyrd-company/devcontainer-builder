name: CI

on:
  push:
  pull_request:

jobs:
  static-unit:
    name: Static and unit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: ./scripts/ci.sh
