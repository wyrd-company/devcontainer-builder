name: CI

on:
  push:
  pull_request:

jobs:
  static-unit:
    name: Static and unit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: ./scripts/ci.sh

  docker-build-integration:
    name: Docker build integration
    runs-on: ubuntu-latest

    env:
      BUILDKIT_HOST: tcp://127.0.0.1:1234

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start BuildKit
        run: |
          docker run --rm --privileged -d \
            --name dcb-buildkitd \
            -p 1234:1234 \
            moby/buildkit:buildx-stable-1 \
            --addr tcp://0.0.0.0:1234

          for i in {1..30}; do
            if docker logs dcb-buildkitd 2>&1 | grep -q "running server"; then
              exit 0
            fi
            sleep 1
          done

          docker logs dcb-buildkitd
          exit 1

      - name: Run Docker build integration
        run: |
          mkdir -p artifacts
          ./scripts/docker-build-integration.sh 2>&1 | tee artifacts/docker-build-integration.log

      - name: Upload Docker build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-integration-log
          path: artifacts/docker-build-integration.log
          if-no-files-found: ignore

      - name: Stop BuildKit
        if: always()
        run: docker rm -f dcb-buildkitd || true
