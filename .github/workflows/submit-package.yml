# relationships:
#   references: [ release, taskfile ]
name: Submit package release
# workflow_run also fires for releases created with GITHUB_TOKEN.
# Recovery requires the original retained handoff, never rebuilt release assets.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release workflow run retaining the original handoff
        required: true
        type: string
      tag:
        description: Bare stable SemVer tag from that Release run
        required: true
        type: string
permissions: {}
concurrency:
  group: submit-package-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_WYRD_FOO_PUBLISHER_COMMIT: 0fe7323712bfc5f109f947b8cb4ddab4f2d42017
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The read token is needed by the exact release-tag fetch.
          persist-credentials: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - id: release_run
        run: task release:run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: package-release-manifest
          path: handoff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.release_run.outputs.run_id }}
      - id: handoff
        run: task release:handoff
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release_run.outputs.head_sha }}
      - run: task release:publisher-pin
        env:
          RELEASE_VERSION: ${{ steps.handoff.outputs.version }}
      - uses: wyrd-company/repo.wyrd.foo/.github/actions/submit-release@0fe7323712bfc5f109f947b8cb4ddab4f2d42017
        with:
          manifest: handoff/release-manifest.json
          app-client-id: ${{ secrets.REPO_WYRD_FOO_PUBLISHER_APP_ID }}
          app-private-key: ${{ secrets.REPO_WYRD_FOO_PUBLISHER_PRIVATE_KEY }}
