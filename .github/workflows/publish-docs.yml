# relationships:
#   references: [ release, taskfile ]
name: Publish docs
# The reusable workflow in wyrd.foo reads the dcb GitHub Release, so a code tag
# publishes after its Release run succeeds. workflow_run also fires for
# releases created with GITHUB_TOKEN. A dcb-docs record publishes on its own
# unless it was pushed with a code tag, and a manual run publishes any ref.
# There is no publish on a plain push to main.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  push:
    tags: [ 'dcb-docs@*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
        type: string
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        type: string
        default: ''
      feature-days:
        description: How long the feature lasts, in days
        type: string
        default: '14'
      feature-reason:
        description: For example "New MCP server"; default "New release"
        type: string
        default: ''
permissions: {}
concurrency:
  group: publish-docs-${{ github.event.workflow_run.id || inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  target:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag is needed to see which code tag sits on a docs record.
          fetch-depth: 0
          # The read token is needed by the exact release-tag fetch.
          persist-credentials: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - id: release_run
        if: github.event_name == 'workflow_run'
        run: task release:run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: package-release-manifest
          path: handoff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.release_run.outputs.run_id }}
      - id: handoff
        if: github.event_name == 'workflow_run'
        run: task release:handoff
        env:
          RELEASE_COMMIT: ${{ steps.release_run.outputs.head_sha }}
      - id: target
        run: task release:docs-target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ steps.handoff.outputs.version }}
  publish:
    needs: target
    if: needs.target.outputs.publish == 'true'
    permissions:
      contents: read
    # ryl disable-line rule:line-length
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@33d4bf27186a70d4f096d57a8e1b7d80a1fb6836 # 2.0.0
    with:
      ref: ${{ needs.target.outputs.ref }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    # Only the two publisher secrets, not the release credentials.
    secrets:
      WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
      WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
