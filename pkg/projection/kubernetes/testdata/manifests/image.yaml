---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    devcontainer.config_file: /repo/.devcontainer/devcontainer.json
    devcontainer.local_folder: /repo
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: devcontainer
  name: image-workspace
  namespace: dev
spec:
  containers:
  - args:
    - -c
    - |-
      echo Container started
      trap "exit 0" 15
      exec "$@"
      while sleep 1 & wait $!; do :; done
    - '-'
    command:
    - /bin/sh
    env:
    - name: APP_ENV
      value: dev
    image: alpine:3.20
    name: devcontainer
    ports:
    - containerPort: 3000
      protocol: TCP
    resources: {}
    volumeMounts:
    - mountPath: /workspaces/app
      name: workspace
    workingDir: /workspaces/app
  restartPolicy: Never
  volumes:
  - hostPath:
      path: /repo
    name: workspace
status: {}
