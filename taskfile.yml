# relationships:
#   references: [CONTRIBUTING, AGENTS]
version: "3"

# build applies: this repository ships dcb. dev does not: this is a batch CLI.
# Integration verbs are separate so CI can report each concern independently.
tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true
  build:
    desc: Build dcb
    cmds:
      - mkdir -p bin
      - go build -o bin/dcb ./cmd/dcb
  test:
    desc: Run unit, compatibility, and race tests
    cmds:
      - go test ./...
      - go test -race ./pkg/host/runner ./pkg/substitute ./pkg/features ./pkg/lifecycle
  lint:
    desc: Check Go, workflow syntax, and release intents without changing files
    cmds:
      - bash scripts/go-format.sh check
      - go vet ./...
      - actionlint .github/workflows/*.yml
      - task: intentional:check
  docs:check:
    desc: Check public Markdown and the wyrd.foo publishing contract
    cmds:
      - rumdl check README.md CONTRIBUTING.md docs/*.md
      # Mirrors wyrd-company/wyrd.foo .github/actions/publish-docs/action.yml gate
      # at fdb54b12e88eaf51a2b22714db63c80aba2ed88a (also pinned in publish-docs.yml).
      - |
        bash <<'DOCS_CHECK'
        set -euo pipefail
        DOCS_DIR=docs
        RUNNER_TEMP="$(mktemp -d)"
        trap 'rm -rf "$RUNNER_TEMP"' EXIT
        MANIFEST="$DOCS_DIR/docs.yml"

        if [ ! -f "$MANIFEST" ]; then
          echo "::notice title=publish-docs::No $MANIFEST — nothing to publish."
          exit 0
        fi

        # Collect docs/*.md whose frontmatter contains `docs: true`.
        mapfile -t PAGES < <(
          for f in "$DOCS_DIR"/*.md; do
            [ -e "$f" ] || continue
            awk 'NR==1 && $0=="---"{fm=1; next} fm && $0=="---"{exit} fm{print}' "$f" \
              | grep -Eq '^docs:[[:space:]]*true[[:space:]]*$' && echo "$f"
          done
        )
        if [ "${#PAGES[@]}" -eq 0 ]; then
          echo "::notice title=publish-docs::No $DOCS_DIR/*.md marked 'docs: true' — nothing to publish."
          exit 0
        fi

        NAME="$(yq -r '.name // ""' "$MANIFEST")"
        STATUS="$(yq -r '.status // ""' "$MANIFEST")"
        TAGLINE="$(yq -r '.tagline // ""' "$MANIFEST")"
        CATEGORY="$(yq -r '.category // ""' "$MANIFEST")"

        fail() { echo "::error title=publish-docs::$1"; exit 1; }
        [ -n "$NAME" ] || fail "docs.yml is missing 'name'."
        [[ "$NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "name '$NAME' must be a URL-safe slug (lowercase, digits, hyphens)."
        [ -n "$TAGLINE" ] || fail "docs.yml is missing 'tagline'."
        [ -n "$CATEGORY" ] || fail "docs.yml is missing 'category'."
        case "$STATUS" in
          stable|preview|planned) : ;;
          *) fail "status '$STATUS' must be one of: stable, preview, planned." ;;
        esac

        ASSETS_TYPE="$(yq -r '.assets | type' "$MANIFEST")"
        if [ "$ASSETS_TYPE" != "!!null" ] && [ "$ASSETS_TYPE" != "!!seq" ]; then
          fail "docs.yml 'assets' must be an array of paths."
        fi

        DOCS_ROOT="$(realpath "$DOCS_DIR")"
        declare -A SEEN_ASSETS=()
        : > "$RUNNER_TEMP/publish_assets.txt"
        while IFS= read -r asset; do
          [ -n "$asset" ] || fail "docs.yml contains an empty asset path."
          [[ "$asset" != /* ]] || fail "asset '$asset' must be relative to $DOCS_DIR/."
          [ -z "${SEEN_ASSETS[$asset]+x}" ] || fail "asset '$asset' is listed more than once."

          source="$(realpath -e -- "$DOCS_DIR/$asset" 2>/dev/null)" \
            || fail "asset '$asset' does not exist."
          [[ "$source" == "$DOCS_ROOT/"* ]] \
            || fail "asset '$asset' resolves outside $DOCS_DIR/."
          [ -f "$source" ] || fail "asset '$asset' must be a file."

          SEEN_ASSETS[$asset]=1
          printf '%s\n' "$asset" >> "$RUNNER_TEMP/publish_assets.txt"
        done < <(yq -r '.assets[]? | select(type == "!!str")' "$MANIFEST")

        ASSET_COUNT="$(yq -r '.assets // [] | length' "$MANIFEST")"
        [ "$ASSET_COUNT" -eq "${#SEEN_ASSETS[@]}" ] \
          || fail "every docs.yml asset must be a string path."

        # Every published page needs title + order (the site schema requires them).
        for f in "${PAGES[@]}"; do
          fm="$(awk 'NR==1 && $0=="---"{fm=1; next} fm && $0=="---"{exit} fm{print}' "$f")"
          printf '%s\n' "$fm" | grep -Eq '^title:' || fail "$f is missing frontmatter 'title'."
          printf '%s\n' "$fm" | grep -Eq '^order:' || fail "$f is missing frontmatter 'order'."
        done

        DOCS_CHECK
  intentional:check:
    desc: Validate release metadata, including the pre-release inventory
    cmds:
      # Before the first tag, status validates config, discovery, and intents.
      # Adopted from the trowel Go reference; no baseline tag is manufactured.
      - |
        if [ -n "$(git tag --list '[0-9]*.[0-9]*.[0-9]*')" ]; then
          intentional check
        else
          intentional status
        fi
  format:
    desc: Format Go files (optional file arguments)
    cmds:
      - bash scripts/go-format.sh write {{.CLI_ARGS}}
  lint:staged:
    desc: Check formatting of staged Go files
    cmds:
      - bash scripts/go-format.sh check {{.CLI_ARGS}}
  lint:commit-msg:
    desc: Validate a conventional commit subject
    cmds:
      - sh scripts/check-commit-subject.sh {{.CLI_ARGS}}
  lint:commit-file:
    desc: Validate a Git commit message file
    cmds:
      - sh scripts/check-commit-subject.sh --file {{.CLI_ARGS}}
  check:
    desc: Run all CI checks (requires Docker and kubeconform)
    cmds:
      - task: lint
      - task: docs:check
      - task: test
      - task: build
      - task: integration:docker
      - task: integration:kubernetes
  # The parity harness owns this task's implementation; keep additions here additive.
  parity:
    desc: Compare upstream and Go devcontainers on reference fixtures
    cmds:
      - go run ./test/parity {{.CLI_ARGS}}
  reference:init:
    desc: Initialize the pinned upstream reference submodules
    cmds:
      - git submodule update --init --depth 1
  tools:install:
    desc: Install repository development tools
    cmds:
      - task: docs:tools
      - go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - go install github.com/evilmartians/lefthook/v2@v2.1.4
      - npm install --global --allow-scripts=@wyrd-company/intentional --@wyrd-company:registry=https://registry.npmjs.org @wyrd-company/intentional@0.1.6
  docs:tools:
    desc: Install public documentation check tools
    cmds:
      - |
        if ! command -v pipx >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipx
        fi
      - pipx install --force rumdl==0.3.0
      - task: release:yaml-tool
  # Docker suite scripts share the 20m per-package budget in integration-timeout.sh.
  integration:docker:
    desc: Run every Docker integration suite on stock Docker
    cmds:
      - bash scripts/ci-integration.sh all
  integration:classic:
    desc: Run engine integration on a disposable classic-store Docker daemon
    cmds:
      - bash scripts/ci-integration.sh classic
  integration:remote:
    desc: Check the optional remote BuildKit path
    cmds:
      - bash scripts/ci-integration.sh remote
  integration:build:
    desc: Run Docker builds on stock Docker
    cmds:
      - bash scripts/ci-integration.sh build
  integration:host:
    desc: Run Docker host integration
    cmds:
      - bash scripts/ci-integration.sh host
  integration:compose:
    desc: Run Docker Compose integration
    cmds:
      - bash scripts/ci-integration.sh compose
  integration:kubernetes:
    desc: Validate Kubernetes manifests without a live cluster
    cmds:
      - mkdir -p artifacts/kubernetes
      - go run ./cmd/internal/render-k8s-testdata > artifacts/kubernetes/devcontainer-kubernetes.yaml
      - kubeconform -strict -kubernetes-version 1.30.0 artifacts/kubernetes/devcontainer-kubernetes.yaml
      - go test ./pkg/projection/kubernetes ./pkg/host/kubernetes
      - go test -tags=k8svalidate ./test/integration/kubernetes -v
  test:heavy:
    desc: Run the additional nightly checks
    cmds:
      - go test ./test/compat -v
      - go test ./pkg/buildkit ./pkg/builder -run 'TestBuild_PlatformConstraint|TestParseTargetPlatforms|TestValidateBuildSupport' -v
      - task: integration:build
      - task: integration:compose
  audit:summary:
    desc: Write the Airlock audit outcome to the job summary
    cmds:
      - |
        printf 'Airlock outcome: %s (complete: %s)\n' "$AIRLOCK_OUTCOME" "$AIRLOCK_COMPLETE" >> "$GITHUB_STEP_SUMMARY"
  release:tools:
    desc: Install the release builder
    cmds:
      - go install github.com/goreleaser/goreleaser/v2@v2.17.0
      - task: release:yaml-tool
  release:check:
    desc: Validate release configuration and packaging contracts without publishing
    env:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "0.0.0"}}'
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - goreleaser check
      - python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - node --test npm/test/*.test.js
  release:snapshot:
    desc: Build all release assets locally without publishing or creating tags
    env:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "0.0.0"}}'
    cmds:
      - goreleaser release --snapshot --clean
      - task: release:stage
  release:stage:
    desc: Pack all five npm tarballs and render the Linux handoff and Homebrew formula
    env:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "0.0.0"}}'
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - python3 scripts/release/stage.py --version "$RELEASE_VERSION" --commit "$(git rev-parse HEAD)"
  release:build:
    desc: Build an Intentional-tagged release without publishing
    cmds:
      - python3 scripts/release/check-tag.py
      - goreleaser release --clean --skip=publish
      - task: release:stage
  release:github:
    desc: Publish prepared assets to GitHub (Bob's release only)
    cmds:
      - bash scripts/release/publish.sh github
  release:npm:
    desc: Publish prepared native npm packages then the launcher (Bob's release only)
    cmds:
      - bash scripts/release/publish.sh npm
  release:homebrew:
    desc: Publish the prepared Homebrew formula (Bob's release only)
    cmds:
      - bash scripts/release/publish.sh homebrew homebrew-tools
  release:run:
    desc: Resolve a successful original Release run for downstream publication
    cmds:
      - python3 scripts/release/run.py resolve
  release:handoff:
    desc: Verify the retained release manifest against its workflow run and tag
    cmds:
      - python3 scripts/release/run.py verify
  release:preflight:
    desc: Check Intentional tag identity and credential presence before publication
    cmds:
      - bash scripts/release/preflight.sh
  release:verify:
    desc: Inspect snapshot artifacts and test an offline npm installation
    env:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "0.0.0"}}'
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - python3 scripts/release/verify.py --version "$RELEASE_VERSION"
  release:inspectors:
    desc: Install Linux package inspection tools for release validation
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y --no-install-recommends rpm
  release:yaml-tool:
    desc: Install the YAML reader used by release agreement tests
    cmds:
      - go install github.com/mikefarah/yq/v4@v4.54.1
  release:publisher-pin:
    desc: Refuse release until the approved package publisher commit is set
    cmds:
      - python3 scripts/release/publisher-pin.py
  release:compatibility:
    desc: Validate and stage the snapshot through the pinned package publisher locally
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - >-
        bash scripts/release/compatibility.sh "$PUBLISHER_ROOT"
        "$REPO_WYRD_FOO_PUBLISHER_COMMIT" dist/release-manifest.json
        dist artifacts/publisher-compatibility
  release:reproducible:
    desc: Prove that two snapshot builds produce the same release and npm bytes
    env:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "0.0.0"}}'
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - python3 scripts/release/reproducible.py
